# Keep the legacy app identifier to preserve compatibility with existing installations.
appId: com.wechatexplorer.app
productName: Wemento
afterPack: scripts/after-pack.cjs
directories:
  buildResources: build
files:
  - out
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraMetadata:
  main: out/main/index.js
asarUnpack:
  - resources/**
  - node_modules/ffmpeg-static/**
  - node_modules/silk-wasm/**
  - node_modules/sherpa-onnx-node/**
  - node_modules/sherpa-onnx-*/**
extraResources:
  # Includes the optional WeChat connector binary for the target platform.
  - from: resources
    to: resources
    filter:
      - '**/*'
  - from: docs/skill/wechatexplorer-reader
    to: skill/wechatexplorer-reader
    filter:
      - '**/*'
win:
  icon: icon.ico
  artifactName: ${name}-${version}-portable-${os}-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  # WCDB's Windows runtime checks the host executable name. The dev runtime is
  # electron.exe, so keep the packaged executable compatible while preserving
  # Wemento as the product/shortcut name.
  executableName: electron
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: installer.nsh
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: icon.icns
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # The bundled WCDB bridge accepts Electron as its internal host name. The
    # public app name is Wemento while the legacy bundle identifier remains compatible.
    CFBundleName: Electron
    CFBundleDisplayName: Wemento
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  icon: icon.png
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: qiuqiu-2
  repo: Wemento
  releaseType: release
